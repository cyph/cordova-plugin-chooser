[javascript.override_constraints."xcode>uuid"]
range = "^11.1.1"
reason = "xcode's uuid.v4 call retains CommonJS support with the advisory fix."
[javascript.override_constraints.qs]
range = "^6.16.0"
reason = "Use the advisory fix even when Express retains an older minor bound."
