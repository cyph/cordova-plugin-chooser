range = ">=1.20.9 <2 || >=2.4.0"
reason = "GHSA-27r3-jxmh-p828; retain the patched Express 4 and 5 API families."
[constraints."npm:undici"]
range = ">=6.29.1 <7 || >=7.30.1 <8 || >=8.12.2"
reason = "GHSA-4qv8-2p9j-2685 and GHSA-xjj6-f33q-929c."
[constraints."npm:brace-expansion"]
range = ">=1.1.21 <2 || >=2.1.7 <3 || >=3.0.9 <4 || >=5.0.12"
reason = "GHSA-q2hr-2g5m-vwhr; retain patched legacy and current API families."
[constraints."npm:http-cache-semantics"]
range = ">=4.3.0"
reason = "GHSA-ch52-4w7c-c8xp."
[constraints."npm:proxy-addr"]
range = ">=2.0.8"
reason = "GHSA-jqcg-44mw-7w3h."
[constraints."npm:compression"]
range = ">=1.8.2"
reason = "GHSA-vc2v-76pw-4v95."
[constraints."npm:systeminformation"]
range = ">=5.33.16"
reason = "GHSA-4vjg-vx72-qq4g and GHSA-3f7j-7jwc-fxfj."
[constraints."npm:glob"]
range = "<9 || >=14.0.2"
reason = "GHSA-3g3m-2fjr-6pw4; retain the unaffected legacy callback API family."
[constraints."npm:minimatch"]
range = "<7 || >=11.0.1"
reason = "GHSA-g3hv-75wg-m249; retain unaffected legacy callable exports."

[javascript.override_constraints."xcode>uuid"]
range = "^11.1.1"
reason = "xcode's uuid.v4 call retains CommonJS support with the advisory fix."
[javascript.override_constraints.qs]
range = "^6.16.1"
reason = "Use the advisory fix even when Express retains an older minor bound."
[javascript.override_constraints.ip-address]
range = "^10.7.4"
reason = "Keep the patched address parser throughout the Cordova tooling graph."
[javascript.override_constraints."body-parser@<2"]
range = "^1.20.9"
reason = "Patch Express 4's exact transitive parser pin within the same API family."
[javascript.override_constraints."undici@<7"]
range = "^6.29.1"
reason = "Keep node-gyp's client on patched Undici 6 without a major API substitution."
[javascript.override_constraints."brace-expansion@<2"]
range = "^1.1.21"
reason = "Patch minimatch's legacy callable export without changing its major API."
[javascript.override_constraints."brace-expansion@>=4"]
range = "^5.0.12"
reason = "Patch the named-export family without substituting the legacy API."
[javascript.override_constraints."glob@>=9"]
range = "^14.0.2"
reason = "Use the cancellation fix in the modern promise/named-export API family."
[javascript.override_constraints."minimatch@>=7"]
range = "^11.0.1"
reason = "Use the patched named-export matcher while retaining legacy callers."

