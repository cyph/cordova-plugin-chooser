[updates]
minimum_age_days = 30
policy_file = "chainman/dependencies.toml"
verify_task = "verify"
outputs = [
  "flake.lock",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "chainman/node.json",
  "chainman/tools.json",
  "tests/android/build.gradle.kts",
  "tests/android/gradle/libs.versions.toml",
  "tests/android/gradle.lockfile",
  "tests/android/buildscript-gradle.lockfile",
  "tests/android/settings-gradle.lockfile",
  "tests/android/gradle/verification-metadata.xml",
  "tests/android15/build.gradle.kts",
  "tests/android15/gradle.lockfile",
  "tests/android15/buildscript-gradle.lockfile",
  "tests/android15/settings-gradle.lockfile",
  "tests/android15/gradle/verification-metadata.xml",
  ".github/workflows/verify.yml",
  "tests/capacitor/locks/app.lockfile",
  "tests/capacitor/locks/runtime.lockfile",
  "tests/capacitor/buildscript-gradle.lockfile",
  "tests/capacitor/settings-gradle.lockfile",
  "tests/capacitor/app/buildscript-gradle.lockfile",
  "tests/capacitor/runtime/buildscript-gradle.lockfile",
  "tests/capacitor/gradle/verification-metadata.xml",
]

[updates.adapters.nix]
adapter = "nix"
profile = "toolchain"
inputs = [
  { directory = ".", input = "nixpkgs", repository = "NixOS/nixpkgs", branch = "nixos-unstable" },
  { directory = ".", input = "nixpkgs-darwin", repository = "NixOS/nixpkgs", branch = "nixpkgs-26.05-darwin" },
]

[updates.adapters.toolchain]
adapter = "toolchain"
profile = "toolchain"
tools = [
  { provider = "npm", name = "pnpm", source_pin = { file = "chainman/tools.json", pointer = [
    "pnpm",
  ] }, command = [
    "pnpm",
    "--version",
  ], version_pattern = '^(?P<version>\d+\.\d+\.\d+)$', pins = [
    { file = "package.json", pointer = [
      "packageManager",
    ], value = "pnpm@{version}" },
  ] },
  { provider = "github", name = "nodejs/node", command = [
    "node",
    "--version",
  ], version_pattern = '^v(?P<version>\d+\.\d+\.\d+)$', pins = [
    { file = "chainman/node.json", value = "{major}.x", pointer = [
      "version",
    ] },
  ] },
]

[updates.adapters.js]
adapter = "javascript"
profile = "toolchain"
directory = "."
mode = "aggressive"
reconcile_policy = true
copy_inputs = [".npmrc"]

# Complex npm alias ranges in package.json are compatibility contracts, retained
# by chainman even in aggressive mode: Android 14/15 and iOS 7/8 stay separate.

[updates.adapters.android14]
adapter = "gradle"
# Record parent/BOM metadata even when Gradle has cached parsed descriptors.
resolve = [
  [
    "gradle",
    "--no-daemon",
    "--refresh-dependencies",
    "dependencies",
    "prepareRobolectricSdks",
    "resolveVerificationDependencies",
    "--write-locks",
    "--write-verification-metadata",
    "sha256",
  ],
]
profile = "android"
directory = "tests/android"
manifests = [
  "tests/android/build.gradle.kts",
  "tests/android/gradle/libs.versions.toml",
]
mode = "compatible"
catalogs = []
maven_repositories = ["central", "google", "plugins"]
pins = [
  { provider = "maven", name = "org.apache.cordova:framework", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "cordova14",
  ], bound = ">=14.0.0,<15.0.0" },
  # AGP 8 supports the selected Gradle 8 / JDK 17 toolchain.
  { provider = "maven", name = "com.android.library:com.android.library.gradle.plugin", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "agp",
  ], bound = ">=8.10.1,<9" },
  # Fixtures use JUnit 4 and the Robolectric 4 / Mockito 5 APIs.
  { provider = "maven", name = "junit:junit", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "junit",
  ], bound = ">=4.13.2,<5" },
  # Upgrade Robolectric together with its frozen SDK identities/instrumentation.
  { provider = "maven", name = "org.robolectric:robolectric", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "robolectric",
  ], bound = "===4.16.1" },
  { provider = "maven", name = "org.mockito:mockito-core", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "mockito",
  ], bound = ">=5.18.0,<6" },
]

[updates.adapters.android15]
adapter = "gradle"
# Record parent/BOM metadata even when Gradle has cached parsed descriptors.
resolve = [
  [
    "gradle",
    "--no-daemon",
    "--refresh-dependencies",
    "dependencies",
    "prepareRobolectricSdks",
    "resolveVerificationDependencies",
    "--write-locks",
    "--write-verification-metadata",
    "sha256",
  ],
]
profile = "android"
directory = "tests/android15"
manifests = [
  "tests/android15/build.gradle.kts",
  "tests/android/gradle/libs.versions.toml",
]
mode = "compatible"
catalogs = []
maven_repositories = ["central", "google", "plugins"]
pins = [
  { provider = "maven", name = "org.apache.cordova:framework", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "cordova15",
  ], bound = ">=15.0.0,<16.0.0" },
]

[updates.adapters.android-sdks]
adapter = "gradle"
# Record parent/BOM metadata even when Gradle has cached parsed descriptors.
resolve = [
  [
    "gradle",
    "--no-daemon",
    "--refresh-dependencies",
    "dependencies",
    "prepareRobolectricSdks",
    "resolveVerificationDependencies",
    "--write-locks",
    "--write-verification-metadata",
    "sha256",
  ],
]
profile = "android"
directories = ["tests/android", "tests/android15"]
manifests = [
  "tests/android/build.gradle.kts",
  "tests/android15/build.gradle.kts",
  "tests/android/gradle/libs.versions.toml",
]
mode = "compatible"
explicit_only = true
maven_repositories = ["central", "google", "plugins"]
# Resolution only: the shared catalog owns the frozen Robolectric/JDK SDK mapping.
# Empty selectors prevent registry version selection during this refresh.
pins = []
catalogs = []

[updates.adapters.github]
adapter = "actions"
profile = "toolchain"
files = [".github/workflows/*.yml"]

[updates.adapters.capacitor]
adapter = "gradle"
profile = "capacitor"
directory = "tests/capacitor"
manifests = [
  "tests/capacitor/build.gradle",
  "tests/capacitor/app/build.gradle",
  "tests/capacitor/runtime/build.gradle",
  "tests/capacitor/settings.gradle",
]
mode = "compatible"
explicit_only = true
pins = []
catalogs = []
maven_repositories = ["central", "google", "plugins"]
resolve = [
  [
    "gradle",
    "--no-daemon",
    "--refresh-dependencies",
    "resolveVerificationDependencies",
    "--write-locks",
    "--write-verification-metadata",
    "sha256",
  ],
]
# Framework sources are owned by the frozen npm graph; these adapters stay inside
# the checkout and never write Gradle state into node_modules.
local_projects = { "com.cyph.chooser.fixtures:app" = "tests/capacitor/app", "com.cyph.chooser.fixtures:runtime" = "tests/capacitor/runtime" }

[[updates.steps]]
resolve = "nix"
[[updates.steps]]
resolve = "toolchain"
[[updates.steps]]
resolve = "js"
[[updates.steps]]
targets = ["js"]
profile = "toolchain"
commands = [["prettier", "--write", "package.json", "pnpm-workspace.yaml"]]
[[updates.steps]]
resolve = "android14"
[[updates.steps]]
resolve = "android15"
[[updates.steps]]
resolve = "android-sdks"
[[updates.steps]]
resolve = "capacitor"
[[updates.steps]]
resolve = "github"

[updates.target_groups]
nix = ["nix", "toolchain", "js", "android14", "android15"]
android = ["android14", "android15"]
