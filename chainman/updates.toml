[updates]
minimum_age_days = 30
policy_file = "chainman/dependencies.toml"
verify_task = "verify"
outputs = [
  "flake.lock",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "chainman/node.json",
  "chainman/tools.json",
  "tests/android/build.gradle.kts",
  "tests/android/gradle/libs.versions.toml",
  "tests/android/gradle.lockfile",
  "tests/android/buildscript-gradle.lockfile",
  "tests/android/settings-gradle.lockfile",
  "tests/android/gradle/verification-metadata.xml",
  "tests/android15/build.gradle.kts",
  "tests/android15/gradle.lockfile",
  "tests/android15/buildscript-gradle.lockfile",
  "tests/android15/settings-gradle.lockfile",
  "tests/android15/gradle/verification-metadata.xml",
  ".github/workflows/verify.yml",
]

[updates.adapters.nix]
adapter = "nix"
profile = "toolchain"
inputs = [
  { directory = ".", input = "nixpkgs", repository = "NixOS/nixpkgs", branch = "nixos-unstable" },
  { directory = ".", input = "nixpkgs-darwin", repository = "NixOS/nixpkgs", branch = "nixpkgs-26.05-darwin" },
]

[updates.adapters.toolchain]
adapter = "toolchain"
profile = "toolchain"
tools = [
  { provider = "npm", name = "pnpm", source_pin = { file = "chainman/tools.json", pointer = [
    "pnpm",
  ] }, command = [
    "pnpm",
    "--version",
  ], version_pattern = '^(?P<version>\d+\.\d+\.\d+)$', pins = [
    { file = "package.json", pointer = [
      "packageManager",
    ], value = "pnpm@{version}" },
  ] },
  { provider = "github", name = "nodejs/node", command = [
    "node",
    "--version",
  ], version_pattern = '^v(?P<version>\d+\.\d+\.\d+)$', pins = [
    { file = "chainman/node.json", value = "{major}.x", pointer = [
      "version",
    ] },
  ] },
]

[updates.adapters.js]
adapter = "javascript"
profile = "toolchain"
directory = "."
mode = "aggressive"
reconcile_policy = true
copy_inputs = [".npmrc"]

# Complex npm alias ranges in package.json are compatibility contracts, retained
# by chainman even in aggressive mode: Android 14/15 and iOS 7/8 stay separate.

[updates.adapters.android14]
adapter = "gradle"
profile = "android"
directory = "tests/android"
manifests = ["tests/android/build.gradle.kts"]
mode = "compatible"
maven_repositories = ["central", "google", "plugins"]
pins = [
  { provider = "maven", name = "org.apache.cordova:framework", file = "tests/android/build.gradle.kts", format = "regex", pattern = 'org\.apache\.cordova:framework:(?P<value>[^"\n]+)', bound = ">=14.0.0,<15.0.0" },
  # AGP 8 supports the selected Gradle 8 / JDK 17 toolchain.
  { provider = "maven", name = "com.android.library:com.android.library.gradle.plugin", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "agp",
  ], bound = ">=8.10.1,<9" },
  # Fixtures use JUnit 4 and the Robolectric 4 / Mockito 5 APIs.
  { provider = "maven", name = "junit:junit", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "junit",
  ], bound = ">=4.13.2,<5" },
  { provider = "maven", name = "org.robolectric:robolectric", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "robolectric",
  ], bound = ">=4.16.1,<5" },
  { provider = "maven", name = "org.mockito:mockito-core", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "mockito",
  ], bound = ">=5.18.0,<6" },
]

[updates.adapters.android15]
adapter = "gradle"
profile = "android"
directory = "tests/android15"
manifests = ["tests/android15/build.gradle.kts"]
mode = "compatible"
maven_repositories = ["central", "google", "plugins"]
pins = [
  { provider = "maven", name = "org.apache.cordova:framework", file = "tests/android15/build.gradle.kts", format = "regex", pattern = 'org\.apache\.cordova:framework:(?P<value>[^"\n]+)', bound = ">=15.0.0,<16.0.0" },
]

[updates.adapters.android-sdks]
adapter = "gradle"
profile = "android"
directories = ["tests/android", "tests/android15"]
manifests = [
  "tests/android/build.gradle.kts",
  "tests/android15/build.gradle.kts",
]
mode = "compatible"
explicit_only = true
maven_repositories = ["central", "google", "plugins"]
# SDK identities are a coordinated Robolectric/JDK contract, refreshed explicitly.
pins = [
  { provider = "maven", name = "org.robolectric:android-all-instrumented", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "robolectric-runtime-sdk",
  ], bound = "===9-robolectric-4913185-2-i7" },
  { provider = "maven", name = "org.robolectric:android-all-instrumented", file = "tests/android/gradle/libs.versions.toml", pointer = [
    "versions",
    "robolectric-compile-sdk",
  ], bound = "===15-robolectric-13954326-i7" },
]

[updates.adapters.github]
adapter = "actions"
profile = "toolchain"
files = [".github/workflows/*.yml"]

[[updates.steps]]
resolve = "nix"
[[updates.steps]]
resolve = "toolchain"
[[updates.steps]]
resolve = "js"
[[updates.steps]]
resolve = "android14"
[[updates.steps]]
resolve = "android15"
[[updates.steps]]
resolve = "android-sdks"
[[updates.steps]]
resolve = "github"

[updates.target_groups]
nix = ["nix", "toolchain", "js", "android14", "android15"]
android = ["android14", "android15"]
