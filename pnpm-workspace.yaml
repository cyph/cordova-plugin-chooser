packages:
  - .
minimumReleaseAge: 43200
minimumReleaseAgeIgnoreMissingTime: false
autoInstallPeers: false
allowBuilds: {}
# Cordova copies platform scripts into the application; they resolve dependencies
# through its ancestors rather than from the original pnpm package directory.
nodeLinker: hoisted
overrides:
  "xcode>uuid": "^11.1.1"
  "qs": "^6.16.0"
  "brace-expansion@<2": "^1.1.21"
  "brace-expansion@>=4": "^5.0.12"
minimumReleaseAgeExclude:
  - "ip-address@10.7.2"
  - "brace-expansion@1.1.21"
  - "brace-expansion@5.0.12"
  - "http-cache-semantics@4.3.0"
  - "proxy-addr@2.0.8"
  - "compression@1.8.2"
