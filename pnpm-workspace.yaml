packages:
  - .
minimumReleaseAge: 43200
minimumReleaseAgeIgnoreMissingTime: false
autoInstallPeers: false
allowBuilds: {}
# Cordova copies platform scripts into the application; they resolve dependencies
# through its ancestors rather than from the original pnpm package directory.
nodeLinker: hoisted
overrides:
  "xcode>uuid": "^11.1.1"
  "qs": "^6.16.1"
  "brace-expansion@<2": "^1.1.21"
  "brace-expansion@>=4": "^5.0.12"
  ip-address: ^10.7.4
  body-parser@<2: ^1.20.9
  undici@<7: ^6.29.1
  glob@>=9: ^14.0.2
  minimatch@>=7: ^11.0.1
  systeminformation: ^5.33.16
minimumReleaseAgeExclude:
  - "@isaacs/nonrecursive-glob-match@1.0.1"
  - body-parser@1.20.9
  - glob@14.0.2
  - ip-address@10.7.4
  - minimatch@11.0.1
  - path-scurry@3.0.0
  - qs@6.16.1
  - systeminformation@5.33.16
  - undici@6.29.1
