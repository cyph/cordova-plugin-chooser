packages:
- .
minimumReleaseAge: 43200
minimumReleaseAgeIgnoreMissingTime: false
autoInstallPeers: false
allowBuilds: {}
# Cordova copies platform scripts into the application; they resolve dependencies
# through its ancestors rather than from the original pnpm package directory.
nodeLinker: hoisted
overrides:
  "xcode>uuid": "^11.1.1"
  "qs": "^6.16.0"
  "brace-expansion@<2": "^1.1.21"
  "brace-expansion@>=4": "^5.0.12"
  ip-address: ^10.7.4
  body-parser@<2: ^1.20.9
  undici@<7: ^6.29.1
minimumReleaseAgeExclude:
- body-parser@1.20.9
- http-cache-semantics@4.3.0
- ip-address@10.7.4
- undici@6.29.1
