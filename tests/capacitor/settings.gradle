pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    plugins {
        id 'com.android.application' version '8.13.2'
        id 'com.android.library' version '8.13.2'
    }
}
buildscript { configurations.classpath { resolutionStrategy.activateDependencyLocking() } }
dependencyResolutionManagement { repositories { google(); mavenCentral() } }
rootProject.name = 'chooser-capacitor'
include ':app', ':capacitor-android', ':cordova-plugin-chooser'
project(':capacitor-android').projectDir = file('runtime')
def chooser = System.getenv('CHOOSER_PLUGIN') ?: file('../..').path
project(':cordova-plugin-chooser').projectDir = new File(chooser, 'capacitor/android')
