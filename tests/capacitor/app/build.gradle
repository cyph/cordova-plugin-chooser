plugins { id 'com.android.application' }
android {
    namespace 'com.cyph.chooser.capacitor'
    compileSdk 36
    defaultConfig {
        applicationId 'com.cyph.chooser.capacitor'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets.main.java.srcDir new File(System.getenv('CHOOSER_PLUGIN') ?: rootProject.file('../..').path, 'src/android')
}
dependencies {
    implementation project(':runtime')
    implementation 'org.apache.cordova:framework:14.0.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
}
