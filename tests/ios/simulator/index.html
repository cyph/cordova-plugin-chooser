<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<script src="cordova.js"></script><script>
const report = text => window.webkit.messageHandlers.fixture.postMessage(text);
const failed = error => report('error:' + String(error));
document.addEventListener('deviceready', () => report('ready'), false);
window.pick = (accept, reopen) => {
  if (!reopen) return chooser.getFileMetadata(accept).then(file => {
    report(file === undefined ? 'canceled:1' : 'selected:' + file.name);
  }, failed);
  const counts = [0, 0];
  function received(index, file) {
    counts[index]++;
    if (file !== undefined || counts[index] !== 1) return failed('Unexpected or duplicate cancellation');
    if (index === 0) choose(1);
    else report('canceled:2;counts:' + counts.join(','));
  }
  function choose(index) {
    if (reopen === 'callback') {
      chooser.getFileMetadata(accept, file => received(index, file), failed).catch(() => {});
    } else {
      chooser.getFileMetadata(accept).then(file => received(index, file), failed);
    }
  }
  choose(0);
};
</script></body></html>
