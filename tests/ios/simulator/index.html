<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<script src="cordova.js"></script><script>
const report = text => window.webkit.messageHandlers.fixture.postMessage(text);
const failed = error => report('error:' + String(error));
document.addEventListener('deviceready', () => report('ready'), false);
window.pick = (accept, reopen, method) => {
  if (window.iosComparisonRelease) {
    if (method !== 'metadata' || (reopen && reopen !== 'promise')) return failed('Unexpected comparison operation');
    const counts = [0, 0];
    async function choose(index) {
      try {
        const result = await window.iosComparisonMetadata(chooser, window.iosComparisonRelease, accept);
        counts[index]++;
        if (result.outcome === 'selected') {
          if (reopen) throw new Error('Unexpected selection');
          report('selected:' + result.file.name);
        } else if (!reopen) report('canceled:1');
        else if (counts[index] !== 1) throw new Error('Duplicate cancellation');
        else if (index === 0) choose(1);
        else report('canceled:2;counts:' + counts.join(','));
      } catch (error) { failed(error); }
    }
    return choose(0);
  }
  if (!reopen) return (method === 'uri' ? chooser.getFile({accept, preferLocal: true, maxFileSize: null}) : chooser.getFileMetadata({accept})).then(async file => {
    if (method === 'uri') {
      if (typeof file.id !== 'string' || file.size <= 0) throw new Error('Invalid managed copy');
      const bytes = await file.readRange({offset: 0, length: Math.min(file.size, 16)});
      if (bytes.length !== Math.min(file.size, 16)) throw new Error('Invalid managed range');
      await file.release();
    }
    report((method === 'uri' ? 'copied:' : 'selected:') + file.name);
  }).catch(error => error instanceof chooser.CancellationError ? report('canceled:1') : failed(error));
  const counts = [0, 0];
  function canceled(index, error) {
    counts[index]++;
    if (!(error instanceof chooser.CancellationError) || counts[index] !== 1) return failed(error);
    if (index === 0) choose(1);
    else report('canceled:2;counts:' + counts.join(','));
  }
  function choose(index) {
    const pending = reopen === 'scoped'
      ? chooser.withFile({accept, maxFileSize: null}, () => { throw new Error('Unexpected selection'); })
      : chooser.getFileMetadata({accept});
    pending.then(() => failed('Unexpected selection'), error => canceled(index, error));
  }
  choose(0);
};
</script></body></html>
