[versions]
agp = "8.10.1"
cordova14 = "14.0.0"
cordova15 = "15.0.0"
junit = "4.13.2"
robolectric = "4.16.1"
# DefaultSdkProvider: API 28 runtime, API 35 maximum compile SDK under JDK 17.
# Keep the exact SDK artifacts coordinated with Robolectric and JDK updates.
robolectric-runtime-sdk = "9-robolectric-4913185-2-i7"
robolectric-compile-sdk = "15-robolectric-13954326-i7"
mockito = "5.18.0"

[libraries]
cordova14 = { module = "org.apache.cordova:framework", version.ref = "cordova14" }
cordova15 = { module = "org.apache.cordova:framework", version.ref = "cordova15" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-sdk-runtime = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-runtime-sdk" }
robolectric-sdk-compile = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-compile-sdk" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
android = { id = "com.android.library", version.ref = "agp" }
