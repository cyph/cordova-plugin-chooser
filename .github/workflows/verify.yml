name: Verify
run-name: Release qualification
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify portable
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman config validate
          nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman deps-check
          nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman deps-coverage
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify
          nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman deps-audit --targets js
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}-portable
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  android:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify android
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify-android
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}-android
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  android-failures:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify android-failures
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify-android-failures
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}-android-failures
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  ios:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify ios
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify-ios
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}-ios
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  ios-modern:
    if: ${{ !github.event.repository.private }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify ios-modern
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify-ios-modern
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}-ios-modern
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  capacitor-android:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify capacitor-android
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify-capacitor-android
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}-capacitor-android
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  ios-simulator:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        framework: [cordova-ios7, cordova-ios8]
        device: [iphone, ipad]
    runs-on: macos-26
    timeout-minutes: 180
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Prepare frozen dependencies
        run: nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
      - name: Exercise native iOS contracts
        run: >-
          nix --extra-experimental-features 'nix-command flakes' run .#just --
          chainman run verify-ios-simulator-part
          '${{ matrix.framework }}' '${{ matrix.device }}'
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain compact simulator diagnostics
        if: ${{ always() && hashFiles('.verification/reports/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-ios-simulator-${{ matrix.framework }}-${{ matrix.device }}-summary
          path: |
            .verification/reports/**/qualification.json
            .verification/reports/**/*-summary.json
            .verification/reports/**/*-tests.json
            .verification/reports/**/*-sources.json
            .verification/reports/**/*-events.log
            .verification/reports/**/*-not-started.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Retain simulator bundles
        if: ${{ always() && hashFiles('.verification/reports/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}-ios-simulator-${{ matrix.framework }}-${{ matrix.device }}
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  qualification:
    if: ${{ always() && !github.event.repository.private }}
    needs:
      [
        portable,
        android,
        android-failures,
        ios,
        ios-modern,
        ios-simulator,
        capacitor-android,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      integrity: ${{ steps.qualify.outputs.integrity }}
    env:
      CHAINMAN_MODE: host-nix
      CHOOSER_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: qualification-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .verification/downloaded
          merge-multiple: true
      - name: Require every lane and matching package integrity
        id: qualify
        run: nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman run qualify

  attest:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/master' }}
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      CHAINMAN_MODE: host-nix
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}-portable
          path: .verification/release-input
      - name: Check and attest the original qualified archive
        env:
          QUALIFIED_INTEGRITY: ${{ needs.qualification.outputs.integrity }}
        run: |
          nix --extra-experimental-features 'nix-command flakes' develop .#default --command node scripts/release.mjs ci "$QUALIFIED_INTEGRITY"
          nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman attest create .verification/release/manifest.json
      - name: Retain attestation bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/release/*.sigstore.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
