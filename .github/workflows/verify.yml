name: Verify
run-name: ${{ inputs.ios_diagnostic && format('iOS diagnostic ({0}, {1}, {2})', inputs.ios_diagnostic_profile, inputs.ios_diagnostic_device || 'iphone', inputs.ios_diagnostic_scope || 'all') || 'Release qualification' }}
on:
  pull_request:
  push:
    branches: [master, "candidate/**"]
  workflow_dispatch:
    inputs:
      ios_diagnostic:
        description: Run the focused iOS diagnostic instead of release qualification
        type: boolean
        default: false
      ios_diagnostic_profile:
        description: Apple profile and host for the focused diagnostic
        type: choice
        options: [baseline, baseline-intel, modern]
        default: baseline
      ios_diagnostic_device:
        description: Device for the focused diagnostic
        type: choice
        options: [iphone, ipad]
        default: iphone
      ios_diagnostic_scope:
        description: Cases to run in the focused diagnostic
        type: choice
        options: [all, dismissal]
        default: all
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ios_diagnostic && format('diagnostic-{0}-{1}-{2}', inputs.ios_diagnostic_profile, inputs.ios_diagnostic_device || 'iphone', inputs.ios_diagnostic_scope || 'all') || false }}
  cancel-in-progress: true
jobs:
  portable:
    if: ${{ !github.event.repository.private && !inputs.ios_diagnostic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify portable
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman config validate
          nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman deps-check
          nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman deps-coverage
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify
          nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman deps-audit --targets js
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-portable
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: error
  android:
    if: ${{ !github.event.repository.private && !inputs.ios_diagnostic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify android
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify-android
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-android
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: error
  android-failures:
    if: ${{ !github.event.repository.private && !inputs.ios_diagnostic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify android-failures
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify-android-failures
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-android-failures
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: error
  ios:
    if: ${{ !github.event.repository.private && !inputs.ios_diagnostic }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify ios
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify-ios
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-ios
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: error
  ios-modern:
    if: ${{ !github.event.repository.private && !inputs.ios_diagnostic }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify ios-modern
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify-ios-modern
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-ios-modern
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: error
  capacitor-android:
    if: ${{ !github.event.repository.private && !inputs.ios_diagnostic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Qualify capacitor-android
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          nix --extra-experimental-features 'nix-command flakes' run .#just -- verify-capacitor-android
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain qualification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-capacitor-android
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: error
  ios-simulator:
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ inputs.ios_diagnostic && inputs.ios_diagnostic_profile == 'modern' && 'xcode-27' || inputs.ios_diagnostic && inputs.ios_diagnostic_profile == 'baseline-intel' && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 180
    env:
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Exercise iOS simulator
        run: |
          nix --extra-experimental-features 'nix-command flakes' run .#just -- setup
          set --
          if [ '${{ inputs.ios_diagnostic }}' = true ]; then
            if [ '${{ inputs.ios_diagnostic_profile }}' = modern ]; then
              task=diagnose-ios-simulator-modern
            else
              task=diagnose-ios-simulator
            fi
            if [ '${{ inputs.ios_diagnostic_device }}' = ipad ]; then
              task="$task-ipad"
            fi
            if [ '${{ inputs.ios_diagnostic_scope }}' = dismissal ]; then
              set -- --dismissal-only
            fi
          else
            task=verify-ios-simulator
          fi
          nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman run "$task" "$@"
      - name: Verify tracked files are unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain compact simulator diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-ios-simulator-summary
          path: |
            .verification/reports/**/qualification.json
            .verification/reports/**/*-summary.json
            .verification/reports/**/*-tests.json
            .verification/reports/**/*-sources.json
            .verification/reports/**/*-events.log
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: error
      - name: Retain simulator bundles
        id: bundles
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.ios_diagnostic && 'diagnostics-ios-simulator-full' || 'qualification-ios-simulator' }}
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: error
      - name: Retry simulator bundle upload
        id: bundles_retry
        if: ${{ always() && steps.bundles.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.ios_diagnostic && 'diagnostics-ios-simulator-full' || 'qualification-ios-simulator' }}
          path: .verification/reports/
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: error
      - name: Require retained simulator bundles
        if: ${{ always() && steps.bundles.outcome != 'success' && steps.bundles_retry.outcome != 'success' }}
        run: exit 1

  qualification:
    if: ${{ always() && !github.event.repository.private && !inputs.ios_diagnostic }}
    needs:
      [
        portable,
        android,
        android-failures,
        ios,
        ios-modern,
        ios-simulator,
        capacitor-android,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHAINMAN_MODE: host-nix
      CHOOSER_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: qualification-*
          path: .verification/downloaded
          merge-multiple: true
      - name: Require every lane and matching package integrity
        run: nix --extra-experimental-features 'nix-command flakes' run .#just -- chainman run qualify
