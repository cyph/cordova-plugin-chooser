[[dependencies.exclusions]]
pattern = "Package.swift"
reason = "Library manifest declares the Capacitor 8 compatibility range. The generated Capacitor app resolves the exact Swift package version, and the Capacitor iOS lane builds both ends of the tested range."

[[dependencies.exclusions]]
pattern = "tests/ios/privacy-plugin/package.json"
reason = "Dependency-free, private fixture installed from this checkout. Portable tests prohibit dependencies and install scripts; adding either requires dependency ownership."

[formatters.json]
paths = [
  "package.json",
  "chainman/*.json",
  "tests/ios/privacy-plugin/package.json",
  "tests/tooling/fixtures/xcresult/*.json",
]
profile = "toolchain"
write = ["prettier", "--write", "--"]
check = ["prettier", "--check", "--"]

[formatters.javascript]
paths = [
  "scripts/*.mjs",
  "scripts/*.cjs",
  "tests/browser/*.cjs",
  "tests/browser/www/*.js",
  "tests/sdk/*.cjs",
  "tests/tooling/*.cjs",
  "tests/tooling/fixtures/*.cjs",
]
profile = "toolchain"
write = ["prettier", "--write", "--"]
check = ["prettier", "--check", "--"]

[formatters.yaml]
paths = [".github/workflows/*.yml", "pnpm-workspace.yaml"]
profile = "toolchain"
write = ["prettier", "--write", "--"]
check = ["prettier", "--check", "--"]

[formatters.toml]
paths = ["chainman.toml", "chainman/*.toml", "tests/*/gradle/*.toml"]
profile = "toolchain"
write = ["taplo", "format", "--"]
check = ["taplo", "format", "--check", "--"]

[formatters.nix]
paths = ["flake.nix"]
profile = "toolchain"
write = ["nixfmt", "--"]
check = ["nixfmt", "--check", "--"]
