schema = 3
include = ["chainman/updates.toml"]

[project]
default_profile = "default"

[profiles.default]
flake = ".#default"
inputs = ["chainman/tools.json"]
allowed_modes = ["host-nix", "container-nix"]
entry_setup = ["javascript"]

[profiles.toolchain]
flake = ".#default"
inputs = ["chainman/tools.json"]
allowed_modes = ["host-nix", "container-nix"]

[profiles.browser]
flake = ".#browser"
inputs = ["chainman/tools.json"]
allowed_modes = ["host-nix", "container-nix"]
allowed_platforms = ["Linux"]
entry_setup = ["javascript"]

[profiles.android]
flake = ".#android"
inputs = ["chainman/tools.json"]
allowed_modes = ["host-nix"]
entry_setup = ["javascript"]

[profiles.ios]
flake = ".#ios"
allowed_modes = ["host-nix"]
allowed_platforms = ["Darwin"]
inputs = ["chainman/apple.json", "chainman/tools.json"]
entry_setup = ["javascript"]

[profiles.capacitor]
flake = ".#capacitor"
inputs = ["chainman/tools.json"]
allowed_modes = ["host-nix"]
entry_setup = ["javascript"]

[profiles.android-emulator]
flake = ".#android-emulator"
inputs = ["chainman/tools.json"]
allowed_modes = ["host-nix"]
allowed_platforms = ["Linux"]
entry_setup = ["javascript"]

[profiles.ios-modern]
flake = ".#ios"
allowed_modes = ["host-nix"]
allowed_platforms = ["Darwin"]
inputs = ["chainman/apple-modern.json", "chainman/tools.json"]
entry_setup = ["javascript"]

[setup.javascript]
profile = "toolchain"
pnpm = true
inputs = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc"]
artifacts = ["node_modules/.modules.yaml"]

[tasks.verify-portable]
profile = "default"
setup = ["javascript"]
commands = [["node", "scripts/verify.mjs", "portable"]]
cleanup_children = true
shutdown_seconds = 10

[tasks.verify-browser]
profile = "browser"
setup = ["javascript"]
commands = [["node", "scripts/verify.mjs", "browser"]]
cleanup_children = true
shutdown_seconds = 10

[tasks.verify]
depends_on = ["verify-portable", "verify-browser"]

[tasks.verify-android]
profile = "android"
setup = ["javascript"]
commands = [["node", "scripts/verify.mjs", "android"]]
cleanup_children = true
shutdown_seconds = 10

[tasks.verify-android-dependencies]
profile = "android"
setup = ["javascript"]
commands = [["node", "scripts/verify.mjs", "android-dependencies"]]
cleanup_children = true
shutdown_seconds = 10

[tasks.verify-ios]
profile = "ios"
setup = ["javascript"]
commands = [["node", "scripts/verify.mjs", "ios"]]
cleanup_children = true
shutdown_seconds = 10

[tasks.verify-ios-modern]
profile = "ios-modern"
setup = ["javascript"]
commands = [["node", "scripts/verify.mjs", "ios-modern"]]
cleanup_children = true
shutdown_seconds = 10

[tasks.verify-ios-simulator]
profile = "ios"
setup = ["javascript"]
commands = [["node", "scripts/verify.mjs", "ios-simulator"]]
cleanup_children = true
shutdown_seconds = 10

[tasks.diagnose-ios-simulator]
profile = "ios"
setup = ["javascript"]
commands = [["node", "scripts/verify.mjs", "ios-simulator-diagnostic"]]
cleanup_children = true
shutdown_seconds = 10

[tasks.diagnose-ios-simulator-modern]
profile = "ios-modern"
setup = ["javascript"]
commands = [
  [
    "node",
    "scripts/verify.mjs",
    "ios-simulator-diagnostic",
    "modern",
  ],
]
cleanup_children = true
shutdown_seconds = 10

[tasks.verify-capacitor-android]
profile = "android-emulator"
setup = ["javascript"]
commands = [["node", "scripts/verify.mjs", "capacitor-android"]]
cleanup_children = true
shutdown_seconds = 10

[tasks.prepare-capacitor]
profile = "capacitor"
setup = ["javascript"]
commands = [["node", "scripts/verify.mjs", "capacitor-prepare"]]
cleanup_children = true
shutdown_seconds = 10

[tasks.verify-android-failures]
profile = "android"
setup = ["javascript"]
commands = [["node", "scripts/verify.mjs", "android-failures"]]
cleanup_children = true
shutdown_seconds = 10

[tasks.qualify]
profile = "default"
commands = [["node", "scripts/verify.mjs", "qualification"]]

[tasks.verify-native]
depends_on = ["verify-android", "verify-ios"]

[tasks.doctor-project]
profile = "toolchain"
commands = [["node", "scripts/verify.mjs", "doctor"]]

[tasks.clean-project]
profile = "toolchain"
commands = [["node", "scripts/verify.mjs", "clean"]]

[recipes]
verify = ["verify"]
clean = ["clean-project"]
doctor = ["doctor-project"]

[hooks]
enabled = true

[[dependencies.exclusions]]
pattern = "tests/ios/privacy-plugin/package.json"
reason = "Dependency-free, private fixture installed from this checkout. Portable tests prohibit dependencies and install scripts; adding either requires dependency ownership."

[formatters.json]
paths = [
  "package.json",
  "chainman/*.json",
  "tests/ios/privacy-plugin/package.json",
]
profile = "toolchain"
write = ["prettier", "--write", "--"]
check = ["prettier", "--check", "--"]

[formatters.javascript]
paths = [
  "scripts/*.mjs",
  "tests/browser/*.cjs",
  "tests/browser/www/*.js",
  "tests/tooling/*.cjs",
]
profile = "toolchain"
write = ["prettier", "--write", "--"]
check = ["prettier", "--check", "--"]

[formatters.yaml]
paths = [".github/workflows/*.yml", "pnpm-workspace.yaml"]
profile = "toolchain"
write = ["prettier", "--write", "--"]
check = ["prettier", "--check", "--"]

[formatters.toml]
paths = ["chainman.toml", "chainman/*.toml", "tests/*/gradle/*.toml"]
profile = "toolchain"
write = ["taplo", "format", "--"]
check = ["taplo", "format", "--check", "--"]

[formatters.nix]
paths = ["flake.nix"]
profile = "toolchain"
write = ["nixfmt", "--"]
check = ["nixfmt", "--check", "--"]
