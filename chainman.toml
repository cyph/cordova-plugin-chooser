  ".>cordova-android>cordova-common>fast-glob>micromatch>picomatch",
  ".>cordova-browser>cordova-common>fast-glob>micromatch>picomatch",
  ".>cordova>cordova-common>fast-glob>micromatch>picomatch",
  ".>cordova>cordova-create>cordova-common>fast-glob>micromatch>picomatch",
  ".>cordova>cordova-create>cordova-fetch>cordova-common>fast-glob>micromatch>picomatch",
  ".>cordova>cordova-create>globby>fast-glob>micromatch>picomatch",
  ".>cordova>cordova-lib>globby>fast-glob>micromatch>picomatch",
  ".>cordova>cordova-lib>cordova-common>fast-glob>micromatch>picomatch",
  ".>cordova>cordova-lib>cordova-fetch>cordova-common>fast-glob>micromatch>picomatch",
